<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIDOY Number Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- HRIDOY লোগো: ক্লিক করলে রিসেট হবে এবং অটোমেটিক কালার বদলাবে -->
        <h2 id="logo-title">HRIDOY</h2>
        
        <input type="file" id="file-input" accept=".txt" />
        <textarea id="input-numbers" placeholder="অথবা এখানে নম্বরগুলো পেস্ট করুন..."></textarea>
        <button id="load-btn">Load Numbers</button>

        <div class="section-title">REMAINING NUMBERS LIST</div>
        <div id="remaining-list" class="number-list"></div>

        <div class="section-title">COPIED NUMBERS LIST</div>
        <div id="copied-list" class="number-list"></div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
