<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Formatter & Copier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Nayon BOND</h2>
        
        <textarea id="input-numbers" placeholder="এখানে আপনার নম্বরগুলো পেস্ট করুন (প্রতি লাইনে একটি)..."></textarea>
        <button id="load-btn">Load Numbers</button>

        <div class="section-title">REMAINING NUMBERS LIST</div>
        <div id="remaining-list" class="number-list"></div>

        <div class="section-title">COPIED NUMBERS LIST</div>
        <div id="copied-list" class="number-list"></div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
