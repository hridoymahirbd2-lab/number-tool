<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIDOY Number Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2 id="logo-title">HRIDOY</h2>
        
        <input type="file" id="file-input" accept=".txt" />
        <textarea id="input-numbers" placeholder="অথবা এখানে নম্বরগুলো পেস্ট করুন..."></textarea>
        
        <!-- প্রিফিক্স ফিল্টার ইনপুট বক্স -->
        <input type="text" id="prefix-input" placeholder="যেমন প্রিফিক্স দিন: +6017" />
        
        <button id="load-btn">Load Numbers</button>

        <div class="lists-wrapper">
            <!-- নির্দিষ্ট প্রিফিক্সের নম্বর লিস্ট -->
            <div class="list-box">
                <div class="section-title">MATCHED LIST</div>
                <div id="remaining-list" class="number-list"></div>
            </div>

            <!-- অন্যান্য বা বাকি নম্বরগুলোর লিস্ট -->
            <div class="list-box">
                <div class="section-title">OTHER NUMBERS</div>
                <div id="other-list" class="number-list"></div>
            </div>
        </div>

        <div class="section-title">COPIED NUMBERS LIST</div>
        <div id="copied-list" class="number-list"></div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
